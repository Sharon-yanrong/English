<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" font-family="Microsoft YaHei, 微软雅黑, PingFang SC, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="600" fill="#FFFFFF"/>
  <text x="540" y="46" text-anchor="middle" font-size="25" font-weight="700" fill="#0F766E">快乐英语岛 · 系统架构</text>

  <!-- 用户设备 -->
  <rect x="55" y="92" width="285" height="120" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.6"/>
  <text x="72" y="120" font-size="17" font-weight="700" fill="#0F766E">用户设备 · 浏览器 App</text>
  <text x="72" y="147" font-size="13.5" fill="#1F2937">单文件 Web（原生 JS）</text>
  <text x="72" y="169" font-size="13.5" fill="#1F2937">GitHub Pages 部署 · 打开即用</text>
  <text x="72" y="191" font-size="13.5" fill="#1F2937">localStorage 保存进度</text>

  <!-- 客户端优化 -->
  <rect x="55" y="232" width="285" height="128" rx="10" fill="#FFF7ED" stroke="#D97706" stroke-width="1.6"/>
  <text x="72" y="260" font-size="15.5" font-weight="700" fill="#B45309">客户端优化（速度 / 可靠性）</text>
  <text x="72" y="286" font-size="13.5" fill="#1F2937">· 首次点击解锁音频（手机可播）</text>
  <text x="72" y="308" font-size="13.5" fill="#1F2937">· 进屏预缓存 → 点读秒响</text>
  <text x="72" y="330" font-size="13.5" fill="#1F2937">· Azure 慢 / 断 → 本地发音兜底</text>
  <text x="72" y="351" font-size="13.5" fill="#1F2937">　（绝不卡住 / 静音）</text>

  <!-- Azure -->
  <rect x="735" y="88" width="300" height="118" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="752" y="116" font-size="17" font-weight="700" fill="#2563EB">Azure 语音服务</text>
  <text x="752" y="143" font-size="13.5" fill="#1F2937">· 神经语音 TTS（自然童声·多种声音）</text>
  <text x="752" y="165" font-size="13.5" fill="#1F2937">· 发音评测 API（0–100 分 + 逐词）</text>
  <text x="752" y="187" font-size="12.5" fill="#64748B">密钥每台设备直连，不写进公开代码</text>

  <!-- Supabase -->
  <rect x="735" y="238" width="300" height="118" rx="10" fill="#ECFDF3" stroke="#16A34A" stroke-width="1.6"/>
  <text x="752" y="266" font-size="17" font-weight="700" fill="#16A34A">Supabase</text>
  <text x="752" y="293" font-size="13.5" fill="#1F2937">· 消息表 / 文件存储（语音·视频）</text>
  <text x="752" y="315" font-size="13.5" fill="#1F2937">· Edge Function（可选代理）</text>
  <text x="752" y="337" font-size="12.5" fill="#64748B">家庭消息 · 房间（公共 / 私密）</text>

  <!-- arrows -->
  <line x1="340" y1="150" x2="735" y2="140" stroke="#64748B" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="537" y="112" text-anchor="middle" font-size="13" fill="#334155">直连 HTTPS · 每台自带密钥</text>

  <line x1="340" y1="292" x2="735" y2="296" stroke="#64748B" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="537" y="284" text-anchor="middle" font-size="13" fill="#334155">fetch REST + 5 秒轮询 · 不用 CDN / SDK（避开被墙）</text>

  <!-- divider -->
  <line x1="55" y1="396" x2="1035" y2="396" stroke="#E2E8F0" stroke-width="1.4"/>
  <text x="55" y="428" font-size="15.5" font-weight="700" fill="#0F766E">发音评测流程</text>

  <!-- pipeline -->
  <g font-size="13" fill="#1F2937">
    <rect x="55"  y="440" width="160" height="60" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/>
    <text x="135" y="466" text-anchor="middle" font-weight="700">① 孩子跟读</text>
    <text x="135" y="487" text-anchor="middle" font-size="11.5" fill="#64748B">对着句子读</text>

    <rect x="245" y="440" width="170" height="60" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/>
    <text x="330" y="466" text-anchor="middle" font-weight="700">② 浏览器录音</text>
    <text x="330" y="487" text-anchor="middle" font-size="11.5" fill="#64748B">16kHz 单声道 WAV</text>

    <rect x="445" y="440" width="170" height="60" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
    <text x="530" y="466" text-anchor="middle" font-weight="700">③ Azure 评测 API</text>
    <text x="530" y="487" text-anchor="middle" font-size="11.5" fill="#64748B">带评测参数</text>

    <rect x="645" y="440" width="170" height="60" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.4"/>
    <text x="730" y="466" text-anchor="middle" font-weight="700">④ 分数 + 逐词</text>
    <text x="730" y="487" text-anchor="middle" font-size="11.5" fill="#64748B">0–100 · 最弱词</text>

    <rect x="845" y="440" width="190" height="60" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.6"/>
    <text x="940" y="466" text-anchor="middle" font-weight="700" fill="#0F766E">⑤ 鼓励式反馈 + 星星</text>
    <text x="940" y="487" text-anchor="middle" font-size="11.5" fill="#64748B">把真实分数转成鼓励</text>
  </g>
  <g stroke="#64748B" stroke-width="1.5" marker-end="url(#arw)">
    <line x1="215" y1="470" x2="243" y2="470"/>
    <line x1="415" y1="470" x2="443" y2="470"/>
    <line x1="615" y1="470" x2="643" y2="470"/>
    <line x1="815" y1="470" x2="843" y2="470"/>
  </g>

  <!-- footer -->
  <text x="55" y="548" font-size="12.5" fill="#64748B">关键取舍：密钥每台设备直连（最快、不进公开代码，避开 GitHub 密钥扫描）· 避开被墙 CDN · 有本地兜底不静音 · 版权全原创</text>
</svg>
